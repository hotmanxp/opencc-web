packages:
  - 'packages/*'
  # Electron 桌面壳(见 apps/desktop)。放在 apps/ 而非 packages/,与
  # packages/ 下的库(会被 zai 依赖)区分开:桌面壳是独立应用产物,不被
  # 任何 workspace 包 import。
  - 'apps/*'
allowBuilds:
  sharp: true
  # node-pty 是原生模块:它的 install 脚本 (scripts/prebuild.js) 需要跑一次,
  # 才能确认/选用 tarball 里自带的 prebuilds/<platform>-<arch> 二进制。
  # 拦住它 = 装出一个 load 不了的 pty.node,PTY 终端直接起不来。
  node-pty: true
onlyBuiltDependencies:
  - sharp
  - node-pty
# 交叉打 Windows 包时需要 win32 的原生 optional 依赖(`@img/sharp-win32-x64`
# 等)。sharp 的 libvips 二进制按平台分包,只装宿主平台的话,打出来的
# 绿色版在 Windows 上第一次用到图像处理就会 load 失败。
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64
