<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>知鸟AI 平台</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f9fafb; color: #0f1115;
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1b1c; color: #f9fafb; }
        .spinner { border-color: rgba(249, 250, 251, 0.25); border-top-color: #f9fafb; }
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(15, 17, 21, 0.18); border-top-color: #0f1115;
        animation: spin 0.9s linear infinite;
      }
      p { margin: 0; font-size: 14px; opacity: 0.75; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <p>正在启动 zai 服务…</p>
    </main>
  </body>
</html>
